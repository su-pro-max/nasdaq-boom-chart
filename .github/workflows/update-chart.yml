name: Refresh Nasdaq boom chart

on:
  schedule:
    # 11:17 UTC, Mon-Fri -> ~7:17am US/Eastern (EDT) / ~6:17am (EST).
    # Offset from :00 to avoid GitHub Actions' top-of-hour scheduling congestion.
    # FRED's NASDAQCOM series publishes with a ~1-business-day lag, so this
    # morning run reliably has the prior trading day's close already available.
    - cron: "17 11 * * 1-5"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy matplotlib pandas yfinance

      - name: Regenerate static chart
        run: python3 update_chart.py

      - name: Regenerate interactive chart
        run: python3 make_interactive.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nasdaq_boom_latest.png nasdaq_boom_interactive.html history/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Nasdaq boom chart ($(date -u +%Y-%m-%d))"
            git push
          fi
